services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgesoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgesoc-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-forgesoc_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - forgesoc-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  forgesoc-postgres-data:
