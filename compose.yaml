services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgesoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgesoc-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-forgesoc_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - forgesoc-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      FORGESOC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forgesoc}:${POSTGRES_PASSWORD:-forgesoc-local-only}@postgres:5432/${POSTGRES_DB:-forgesoc_dev}
    ports:
      - "127.0.0.1:${FORGESOC_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  forgesoc-postgres-data:
