name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORGESOC_DATABASE_URL: postgresql+psycopg://forgesoc:forgesoc-ci@localhost:5432/forgesoc_test
      FORGESOC_TEST_DATABASE_URL: postgresql+psycopg://forgesoc:forgesoc-ci@localhost:5432/forgesoc_test
      FORGESOC_SESSION_SECRET: ci-only-session-secret-not-for-production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forgesoc
          POSTGRES_PASSWORD: forgesoc-ci
          POSTGRES_DB: forgesoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgesoc -d forgesoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Validate database migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -v

      - name: Build distributions
        run: uv build

      - name: Smoke test command-line pipeline
        run: |
          uv run forgesoc-generate --scenario brute-force --output data/generated/ci.jsonl
          uv run forgesoc data/generated/ci.jsonl data/alerts.jsonl
          uv run forgesoc-normalize data/raw/windows_brute_force.jsonl data/normalized/ci.jsonl
          uv run forgesoc data/normalized/ci.jsonl data/alerts.jsonl
          uv run forgesoc-db health
          uv run forgesoc-db ingest data/normalized/ci.jsonl
          uv run forgesoc-db detect --start 2026-09-19T00:00:00Z --end 2026-09-20T00:00:00Z
          uv run forgesoc-db stats

      - name: Smoke test web console
        run: |
          uv run forgesoc-web --host 127.0.0.1 --port 8000 &
          API_PID=$!
          trap 'kill $API_PID' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          AUTH_STATUS=$(curl --fail --silent http://127.0.0.1:8000/api/v1/auth/status)
          if printf '%s' "$AUTH_STATUS" | python -c \
            'import json,sys; raise SystemExit(0 if json.load(sys.stdin)["initialized"] else 1)'; then
            AUTH_OPERATION=login
          else
            AUTH_OPERATION=bootstrap
          fi
          AUTH_RESPONSE=$(curl --fail-with-body --silent --show-error -X POST \
            "http://127.0.0.1:8000/api/v1/auth/$AUTH_OPERATION" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"correct-horse-battery"}')
          TOKEN=$(printf '%s' "$AUTH_RESPONSE" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl --fail --silent http://127.0.0.1:8000/api/v1/stats \
            -H "Authorization: Bearer $TOKEN" > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/coverage \
            -H "Authorization: Bearer $TOKEN" > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/openapi.json > /dev/null
