[project]
name = "forgesoc"
version = "0.1.0"
description = "Experimental Detection and Response Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
forgesoc = "forgesoc.main:main"
forgesoc-generate = "forgesoc.simulation.main:main"
forgesoc-normalize = "forgesoc.normalization.main:main"
forgesoc-db = "forgesoc.persistence.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a dedicated PostgreSQL test database",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
packages = ["forgesoc"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgesoc"]
